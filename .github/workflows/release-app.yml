name: Release App
on:
  push:
    tags: ['app@[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    uses: ./.github/workflows/qa.yml
  build:
    needs: qa
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yohey-release
          path: assets
      - uses: actions/attest@v4
        with:
          subject-path: assets/*
      - name: Verify provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-app.yml"
          done
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
